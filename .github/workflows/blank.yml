module "ec2" {
  source                      = "git::https://github.com/my-org/terraform-ec2-module.git"
  create                      = true
  name                        = "ecs-container-host"
  ami                         = var.ec2_ecs_base
  instance_type               = "t3.medium"
  subnet_id                   = var.subnet_id
  key_name                    = var.key_name
  monitoring                  = true
  associate_public_ip_address = true
  vpc_security_group_ids      = var.vpc_security_group_ids
  
  root_block_device = [
    {
      volume_type = "gp3"
      volume_size = 30
      encrypted   = true
    }
  ]
  
  tags = local.tags
}
